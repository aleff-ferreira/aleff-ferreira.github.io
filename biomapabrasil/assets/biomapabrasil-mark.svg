<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BioMapaBrasil">
  <defs>
    <radialGradient id="bg" cx="36%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#143b2d"/>
      <stop offset="48%" stop-color="#081913"/>
      <stop offset="100%" stop-color="#040a08"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#34d399" stop-opacity=".30"/>
      <stop offset="52%" stop-color="#22d3ee" stop-opacity=".11"/>
      <stop offset="100%" stop-color="#040a08" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1=".5" y1="0" x2=".5" y2=".92">
      <stop offset="0%" stop-color="#eafff6" stop-opacity=".11"/>
      <stop offset="72%" stop-color="#eafff6" stop-opacity=".02"/>
      <stop offset="100%" stop-color="#eafff6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity=".85"/>
      <stop offset="45%" stop-color="#1f513e" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity=".80"/>
    </linearGradient>
    <linearGradient id="leaf" x1=".18" y1=".08" x2=".82" y2=".95">
      <stop offset="0%" stop-color="#b2f7dc"/>
      <stop offset="38%" stop-color="#34d399"/>
      <stop offset="78%" stop-color="#10855c"/>
      <stop offset="100%" stop-color="#084c35"/>
    </linearGradient>
    <linearGradient id="prism" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0%" stop-color="#38d9f5" stop-opacity=".20"/>
      <stop offset="55%" stop-color="#34d399" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="mol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8af0c8"/>
      <stop offset="50%" stop-color="#38d9f5"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="rio" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="48%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <radialGradient id="seed" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#fffef5"/>
      <stop offset="36%" stop-color="#fde047"/>
      <stop offset="76%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="seedHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity=".82"/>
      <stop offset="52%" stop-color="#34d399" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="leafClip">
      <path d="M32 15.5C16.8 23.1 15.8 40.9 32 48.5Z"/>
    </clipPath>
  </defs>

  <!-- Caixa squircle de obsidiana com duplo bisel de cristal -->
  <path d="M32 1.25C50 1.25 57.4 1.25 60.1 3.9C62.75 6.6 62.75 14 62.75 32C62.75 50 62.75 57.4 60.1 60.1C57.4 62.75 50 62.75 32 62.75C14 62.75 6.6 62.75 3.9 60.1C1.25 57.4 1.25 50 1.25 32C1.25 14 1.25 6.6 3.9 3.9C6.6 1.25 14 1.25 32 1.25Z" fill="url(#bg)" stroke="url(#rim)" stroke-width=".95"/>
  <path d="M32 2.8C48.8 2.8 55.9 2.8 58.5 5.5C61.2 8.1 61.2 14.8 61.2 28Q32 22 2.8 28C2.8 14.8 2.8 8.1 5.5 5.5C8.1 2.8 15.2 2.8 32 2.8Z" fill="url(#sheen)"/>
  <circle cx="32" cy="32" r="26.5" fill="url(#aura)"/>

  <!-- Anel de astrolábio cartográfico + marcas cardeais + paralelo equatorial -->
  <circle cx="32" cy="32" r="25.0" fill="none" stroke="#8af0c8" stroke-opacity=".24" stroke-width=".8"/>
  <circle cx="32" cy="32" r="22.6" fill="none" stroke="#38d9f5" stroke-opacity=".10" stroke-width=".55" stroke-dasharray="1.2 2.4"/>
  <path d="M32 5.0v3.1M32 55.9v3.1M5.0 32h3.1M55.9 32h3.1" stroke="#a7f3d0" stroke-opacity=".65" stroke-width="1.15" stroke-linecap="round"/>
  <path d="M8.8 32Q32 35.6 55.2 32" fill="none" stroke="#38d9f5" stroke-opacity=".28" stroke-width=".85" stroke-dasharray="1.6 2.4"/>

  <!-- Hemisfério esquerdo: Folha amazônica esculpida + nervuras botânicas recortadas na margem -->
  <path d="M32 15.5C16.8 23.1 15.8 40.9 32 48.5Z" fill="url(#leaf)"/>
  <path d="M32 26.8C27.4 25.8 23.8 23.4 20.6 19.8M32 34.8C26.4 33.6 22.2 30.6 19.2 26.6M32 42.6C27.6 41.6 24.0 39.2 21.2 36.0" clip-path="url(#leafClip)" fill="none" stroke="#ecfdf5" stroke-opacity=".46" stroke-width="1.0" stroke-linecap="round"/>
  <path d="M32 15.5C16.8 23.1 15.8 40.9 32 48.5" fill="none" stroke="#ecfdf5" stroke-opacity=".68" stroke-width=".95" stroke-linecap="round"/>

  <!-- Hemisfério direito: Prisma molecular hexagonal + duplas ligações aromáticas + substituinte -->
  <path d="M32 15.5L45.8 23.75V40.25L32 48.5Z" fill="url(#prism)"/>
  <line x1="32" y1="15.5" x2="32" y2="48.5" stroke="#a7f3d0" stroke-opacity=".36" stroke-width=".85"/>
  <path d="M32 15.5L45.8 23.75V40.25L32 48.5" fill="none" stroke="url(#mol)" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34.8 20.4L42.6 25.1M42.6 38.9L34.8 43.6" fill="none" stroke="#e0f2fe" stroke-opacity=".80" stroke-width="1.25" stroke-linecap="round"/>
  <path d="M45.8 23.75L50.1 21.2" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Fita hidrográfica caligráfica do Rio Amazonas (espessura variável) -->
  <path d="M18.6 39.5C22.6 39.1 26.0 35.1 30.7 30.9C35.3 26.6 40.2 23.5 45.8 23.0L45.8 24.55C40.8 25.2 36.7 28.1 33.0 33.0C28.6 37.8 23.8 41.2 19.3 40.95C18.5 40.9 18.1 39.9 18.6 39.5Z" fill="#042f2e" fill-opacity=".55" transform="translate(0 .7)"/>
  <path d="M18.6 39.5C22.6 39.1 26.0 35.1 30.7 30.9C35.3 26.6 40.2 23.5 45.8 23.0L45.8 24.55C40.8 25.2 36.7 28.1 33.0 33.0C28.6 37.8 23.8 41.2 19.3 40.95C18.5 40.9 18.1 39.9 18.6 39.5Z" fill="url(#rio)"/>

  <!-- Joias atômicas covalentes nos vértices moleculares (todas dentro do astrolábio) -->
  <circle cx="32" cy="15.5" r="2.1" fill="#a7f3d0"/>
  <circle cx="45.8" cy="23.75" r="2.55" fill="#38d9f5"/>
  <circle cx="45.8" cy="23.75" r="1.0" fill="#f0fdfa"/>
  <circle cx="50.4" cy="21.0" r="1.9" fill="#c4b5fd"/>
  <circle cx="50.4" cy="21.0" r=".7" fill="#f5f3ff"/>
  <circle cx="45.8" cy="40.25" r="2.45" fill="#6ee7b7"/>
  <circle cx="45.8" cy="40.25" r=".95" fill="#ecfdf5"/>
  <circle cx="32" cy="48.5" r="2.1" fill="#34d399"/>

  <!-- Núcleo central: Semente bioluminescente dourada ("Da floresta à molécula") -->
  <circle cx="32" cy="32" r="8.6" fill="url(#seedHalo)"/>
  <circle cx="32" cy="32" r="4.1" fill="url(#seed)" stroke="#fef9c3" stroke-opacity=".88" stroke-width=".75"/>
</svg>
